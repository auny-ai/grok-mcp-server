# Runs on every push to main and every pull request. There is no test runner in this
# repo, so this is a type check plus a build check: tsc catches a broken type, and
# `wrangler deploy --dry-run` catches a broken bundle, neither without touching Cloudflare.
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx wrangler deploy --dry-run --outdir /tmp/wdo
