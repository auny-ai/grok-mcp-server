name: Feature request
description: A new Grok tool, an auth mode, or a deploy behaviour you need. Lead with the failure.
labels: [enhancement]
body:
  - type: textarea
    id: failure
    attributes:
      label: The failure this would prevent
      description: What went wrong, for whom, and how often?
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What kind of change
      options:
        - A new xAI tool (src/index.ts)
        - Auth or the /mcp gate (src/auth.ts)
        - Deploy or config (wrangler.jsonc, mcp.json)
        - Docs
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The smallest change that prevents the failure.
